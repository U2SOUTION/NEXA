<!DOCTYPE html>
<!-- Extension Popup UI: iframe 방식으로 NEXA Platform의 U2BEE UI를 표시 -->
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>U2BEE</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <!-- TODO: 외부 서버 배포 시 localhost를 공인 도메인으로 변경 필요 -->
        <iframe
            id="u2bee-iframe"
            src="http://localhost:9000/#/extension?extension=u2bee&mode=popup"
            allow="clipboard-read; clipboard-write"
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation allow-top-navigation-by-user-activation"
            frameborder="0"
            style="border: 0"
        ></iframe>
        <script src="popup.js"></script>
    </body>
</html>
