<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U2BEE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 800px;
            height: 600px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        #u2bee-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .mode-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .mode-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 14px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">로딩 중...</div>
    <button id="mode-toggle" class="mode-toggle">사이드 패널로</button>
    <iframe 
        id="u2bee-iframe" 
        src="http://localhost:9000/#/extension?extension=u2bee&mode=popup" 
        allow="clipboard-read; clipboard-write"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation allow-top-navigation-by-user-activation"
    ></iframe>
    <script src="popup.js"></script>
</body>
</html>
