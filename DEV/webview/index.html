<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .content {
            padding: 40px;
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 20px;
        }
        
        .card p {
            color: #666;
            line-height: 1.6;
        }
        
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 10px 5px;
            transition: opacity 0.3s;
        }
        
        .button:hover {
            opacity: 0.9;
        }
        
        .status {
            display: inline-block;
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            margin: 20px 0;
        }
        
        .input-group {
            margin: 20px 0;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 NEXA Platform</h1>
            <p>커스텀 웹사이트 UI - 완전한 제어 가능</p>
        </div>
        
        <div class="content">
            <div class="status">✅ 정상 작동 중</div>
            
            <div class="input-group">
                <label>플랫폼 연결 상태</label>
                <input type="text" id="statusInput" value="연결됨" readonly>
            </div>
            
            <div class="card-grid">
                <div class="card">
                    <h3>📊 데이터 관리</h3>
                    <p>플랫폼 데이터를 효율적으로 관리하고 분석할 수 있습니다.</p>
                    <button class="button" onclick="handleDataManagement()">데이터 관리</button>
                </div>
                
                <div class="card">
                    <h3>🔗 연결 관리</h3>
                    <p>외부 시스템과의 연결을 설정하고 관리합니다.</p>
                    <button class="button" onclick="handleConnection()">연결 설정</button>
                </div>
                
                <div class="card">
                    <h3>⚙️ 설정</h3>
                    <p>플랫폼 설정을 변경하고 커스터마이징합니다.</p>
                    <button class="button" onclick="handleSettings()">설정 열기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        
        function handleDataManagement() {
            vscode.postMessage({
                command: 'dataManagement',
                data: { action: 'open' }
            });
            alert('데이터 관리 기능이 호출되었습니다!');
        }
        
        function handleConnection() {
            vscode.postMessage({
                command: 'connection',
                data: { action: 'setup' }
            });
            alert('연결 설정이 호출되었습니다!');
        }
        
        function handleSettings() {
            vscode.postMessage({
                command: 'settings',
                data: { action: 'open' }
            });
            alert('설정이 호출되었습니다!');
        }
        
        // 확장 프로그램에서 메시지 수신
        window.addEventListener('message', event => {
            const message = event.data;
            switch (message.command) {
                case 'updateStatus':
                    document.getElementById('statusInput').value = message.status || '연결됨';
                    break;
                case 'updateData':
                    // 데이터 업데이트 처리
                    console.log('데이터 업데이트:', message.data);
                    break;
            }
        });
        
        // 초기화
        console.log('NEXA Platform 웹사이트 로드 완료');
    </script>
</body>
</html>
