# AGENTS_v2.md
### NEXA Platform v2 – AI 에이전트 핵심 통제 규칙

> AI는 **'보조자'** 다. 구조를 해석하거나 재설계하지 않는다.
> 불확실하면 추측하지 말고 **반드시 질문한다**.

---

## 1️⃣ 전역 원칙

- 빠른 구현보다 **구조적 안정성** 우선
- 편의·축약·요령을 위한 코드 허용하지 않음
- 한 번에 큰 변경보다 **작고 되돌릴 수 있는 변경** 선호
- AI는 판단자가 아니라 **지시에 따라 움직이는 작업자**

---

## 2️⃣ 절대 수정 금지 영역 (No-Touch Zone)

> 명시적 지시 없이 아래 경로는 **절대 수정하지 않는다.**
> 이 영역을 건드리면 전체 시스템 안정성이 붕괴된다.

| 경로 | 역할 |
|------|------|
| `/src/system/**` | 전역 규칙 · 타입 · 스키마 · 상수 |
| `/src/frame/**` | 플랫폼 프레임 · 레이아웃 |
| `/src/engines/**` | 핵심 엔진 |
| `/src/assets/**` | 디자인 시스템 |
| `/public/**` | 공용 리소스 |

---

## 3️⃣ 도메인 수정 규칙

- AI는 **한 번에 하나의 도메인만** 수정한다
- 도메인 간 교차 수정 ❌
- 다른 도메인 코드 직접 참조 ❌

**도메인 내부에서 허용**
- `views/` UI 구현
- 도메인 전용 `components`
- 도메인 로컬 `store` 로직

**도메인 내부에서 금지**
- `types.ts` / `schemas.ts` / `constants.ts` 파일 생성 ❌
- Zod 스키마 직접 정의 ❌
- 임의 타입 선언 ❌
- `as const` 상수 블록 생성 ❌
- system 계층으로 로직 이동 ❌
- frame / layout 계약 변경 ❌

---

## 4️⃣ system 계층 중앙집중 규칙

> 이 플랫폼은 IoT + AI 연동 구조로 모든 도메인이 유기적으로 연결된다.
> 타입·스키마·상수·설정은 **반드시 system 계층에서만 정의한다.**

| 위치 | 역할 | 특징 |
|------|------|------|
| `system/types/` | 자료형 규정 | 컴파일 타임, 런타임에 사라짐 |
| `system/schemas/` | 데이터 검증 | 런타임 실행, 경계 데이터 검문 |
| `system/constants/` | 고정값 | `as const`, 절대 변경 안 되는 값 |
| `system/config/` | 환경 설정 | `.env` 기반, 환경마다 달라지는 값 |

**데이터 & 스키마**
- `/src/system/schemas` 가 **유일한 데이터 표준**이다. 도메인 내부에서 schema 정의·복사·임시 모델 생성 금지. 모든 데이터 구조는 **전역 표준**을 따른다.

**새 타입·스키마·상수 추가 절차**
1. `system/` 하위 적절한 폴더에 먼저 추가
2. `index.ts` 에서 re-export 확인
3. 도메인에서는 **import만** 사용

**스키마 검증 대상 — 경계를 넘는 모든 데이터**
```
외부 → 내부  (엣지 디바이스, MQTT, 외부 API)    ← 반드시 검증
내부 → 내부  (도메인 간 데이터 전달)             ← 반드시 검증
내부 → 외부  (디바이스 명령, AI 출력 → 디바이스) ← 반드시 검증
```

> ⚠️ **AI 모델 출력값은 신뢰하지 않는다.**
> AI 출력은 반드시 `system/schemas` 를 통과한 후에만 디바이스로 전달한다.

---

## 5️⃣ TypeScript 규칙

- `any` 사용 **절대 금지** — 타입을 모르면 추측하지 말고 질문한다
- `unknown` 으로 받고 스키마로 검증하는 패턴을 사용한다
- 타입 추론이 가능한 경우 불필요한 타입 명시 생략
- 상수는 반드시 `as const` 사용
- 새 타입 필요 시 `system/types/` 에만 추가, 도메인 내 선언 금지

```typescript
// ❌ 금지
function process(data: any) { ... }

// ✅ 올바른 패턴
function process(data: unknown) {
  const validated = SomeSchema.parse(data)  // system/schemas 사용
}
```

---

## 6️⃣ 레이아웃 & View 규칙

- 레이아웃 구조는 `/src/frame/layout` 에서만 정의
- 모든 도메인은 **3단 구조** 준수: `left / content / right`
- `views` 는 **UI 표현만** 담당, 비즈니스 로직 작성 금지
- 로직이 필요하면 → 기존 composable 사용 → 없으면 **중단 후 질문**

---

## 7️⃣ Composables 규칙

- `system/composables` 를 먼저 확인하고 우선 사용
- 새 composable 은 반드시 **도메인 내부**에 생성
- 전역 상태 직접 영향 ❌
- system store / eventBus 우회 ❌

---

## 8️⃣ 네이밍 & Import 규칙

- Import 경로는 **반드시 `@/` 별칭** 사용, 상대경로(`../../`) 금지
- 파일명: `camelCase.ts` (일반) / `PascalCase.vue` (컴포넌트)
- 타입명: `PascalCase` / 상수명: `UPPER_SNAKE_CASE`
- 취향 기반 네이밍 변경 ❌

```typescript
// ❌ 금지
import { SomeType } from '../../system/types'

// ✅ 올바른 패턴
import { SomeType } from '@/system/types'
```

---

## 9️⃣ CSS / DOM 규칙

**Quasar**
- Quasar 컴포넌트 **내부 DOM 구조를 가정하지 않는다**. `.q-*` 클래스 구조에 의존한 CSS 작성 금지.
- 스타일 문제 시 deep selector / !important / 과도한 DOM 래핑 대신 **구조 단순화 또는 전용 래퍼 클래스**를 우선 고려한다.

**DOM**
- 불필요한 wrapper div 생성 ❌. 의미 없는 컨테이너 중첩 금지. 스타일 목적만을 위한 DOM 추가 금지.
- **CSS 문제는 DOM을 늘려서 해결하지 않는다.** 기존 DOM 구조를 먼저 이해하고, 제거 가능한 중첩이 있으면 추가보다 제거를 우선한다.

**인라인 스타일**
- `style=""` 은 **원칙적으로 금지**. 아래 조건을 모두 만족할 때만 임시 허용: 계산된 값 필요, 동적 값으로 class 분리 불가, 언제든 CSS 파일로 이동 가능한 형태. 허용 시 반드시 주석:
```html
<!-- TODO: move to system css when stabilized -->
```

**SCSS**
- 중첩 **최대 2단계**까지만 허용. 3단계 이상 ❌. 구조 의존 선택자 (`.a .b .c`) ❌.
- 허용 예: `.card { .title {} }`  /  금지 예: `.card { .content { .inner { .text {} } } }`

**`:deep()` / `::v-deep`**
- **최후의 수단**. 사용 전 통과할 질문: (1) DOM 구조를 단순화할 수 없는가? (2) 전용 class를 노출할 수 없는가? (3) 시스템 CSS로 해결할 수 없는가? 하나라도 "예"가 아니면 deep 사용 금지. 사용 시 주석 필수:
```scss
// deep 사용 이유: Quasar 내부 구조 접근 불가
```

**`!important`**
- **원칙적으로 금지**. 테마 충돌·Quasar 강제 스타일 덮기 외 허용하지 않음. 사용 시 주석 필수:
```scss
color: red !important; // unavoidable: Quasar inline priority
```

**CSS 위치 전략**
1. 컴포넌트 내부 `<style scoped>` 우선. 안정되면 `/src/system/css/nexa-system/` 으로 이동. 전역 이동을 염두에 둔 네이밍 사용.
2. 컴포넌트 한정 스타일을 system css에 바로 추가 ❌. 실험용 스타일을 전역에 추가 ❌.

**CSS 파일 구조 (변경·재해석 금지)**
```
레벨 1~3: Quasar + App 기본
레벨 4: 테마
레벨 5: Nexa 시스템 UI 표준
```
- 새 시스템 UI 패턴은 `nexa-system/_*.scss` 로만 추가. 임의의 전역 scss 파일 생성 ❌.

**CSS 수정 전 AI 자가 질문**
1. 이 스타일은 DOM 중첩 없이 해결 가능한가?
2. scoped로 충분한가?
3. 나중에 system css로 이동 가능한가?
4. Quasar 내부 구조에 의존하고 있는가?
→ 하나라도 불명확하면 **중단 후 질문**.

---

## 🔟 작업 전 필수 자가 점검 & 안전 원칙

**수정 전 반드시 확인**
1. 어떤 파일을 수정하는가?
2. 왜 이 수정이 필요한가?
3. 기존 구조로는 왜 부족한가?
4. 이 변경은 되돌릴 수 있는가?

→ 하나라도 명확하지 않으면 **즉시 중단**한다.

**금지 행동 목록**
- 전체 리팩토링
- 여러 폴더를 넘나드는 정리
- 취향 기반 네이밍 변경
- 구조 재해석
- 조용한 동작 변경 (silent behavior change)

**불확실할 때는 항상 (Fail-Safe)**
- 더 적게 수정한다
- 파일 수를 줄인다
- 질문을 선택한다
- "알아서" 행동하지 않는다

> 하나라도 명확하지 않으면 **즉시 중단**한다.