# NEXA 플랫폼 개발 환경 (Postgres 마이그레이션 후)
# 0. .env에 PGHOST, PGUSER, PGPASSWORD, PGDATABASE, PGPORT, REDIS_URL 설정
# 1. Postgres·Redis만 띄우기: docker compose -f docker-dev-compose.yml up -d postgres redis
# 2. 서버 로컬 실행: npm run dev:server (PGHOST=localhost, REDIS_URL=redis://localhost:6379)
# 3. 전체: docker compose -f docker-dev-compose.yml up -d
# ==========================================
services:
  redis:
    container_name: nexa-redis-dev
    image: redis:7-alpine
    command: redis-server --save 60 1
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    container_name: nexa-postgres-dev
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-nexa_db}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-nexa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nexa-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-nexa-web
    ports:
      - '9000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - PGHOST=postgres
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGDATABASE=${PGDATABASE:-nexa_db}
      - PGPORT=5432
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  dev-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: dev-cloudflared-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres_data_dev:
  redis_data_dev:
