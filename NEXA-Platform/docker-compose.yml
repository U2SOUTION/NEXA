# NEXA 플랫폼 배포 (Postgres 마이그레이션 후)
# 0. .env: PGUSER, PGPASSWORD, PGDATABASE, CLOUDFLARE_TUNNEL_TOKEN 등 설정
# 1. cd /mnt/web_data/nexa-platform
# 2. docker load -i nexa-platform.tar
# 3. docker compose up -d
# ==========================================

services:
  redis:
    container_name: nexa-redis
    image: redis:7-alpine
    command: redis-server --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    container_name: nexa-postgres
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE:-nexa_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-nexa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nexa-web:
    image: nexa-platform:latest
    container_name: nexa-web
    ports:
      - '8080:3000'
    environment:
      - PGHOST=postgres
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGDATABASE=${PGDATABASE:-nexa_db}
      - PGPORT=5432
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  postgres_data:
  redis_data:
