# NEXA 플랫폼 배포 매뉴얼 (이 파일은 새로 도커 이미지를 NAS에 배포하는 명령어 파일)
# ------------------------------------------
# 0. .env 파일 생성: 루트의 .env.example 참고해 MYSQL_*, CLOUDFLARE_TUNNEL_TOKEN 등 설정
# 1. 폴더이동: cd /mnt/web_data/nexa-platform  (docker-compose.yml 파일이 있는 폴더로 이동)
# 2. 이미지 로드: docker load -i nexa-platform.tar
# 3. NAS에서 실행: docker compose up -d (같은 폴더의 .env 자동 로드)
# 4. 중지: docker compose down
# 5. 로그 확인: docker compose logs -f
# ==========================================

services:
  nexa-web:
    image: nexa-platform:latest # 도커 이미지 이름 (Dockerfile에서 빌드한 이미지)
    container_name: nexa-web # 컨테이너 이름 (Dockerfile에서 빌드한 이미지)
    ports:
      - '8080:3000' # 외부(NAS) 8080포트를 컨테이너 내부 3000포트로 포트 포워딩
    environment: # .env에서 주입 (비밀 등 하드코딩 금지)
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_PORT=${MYSQL_PORT}
    restart: always # NAS 재부팅 시 자동 실행

  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
