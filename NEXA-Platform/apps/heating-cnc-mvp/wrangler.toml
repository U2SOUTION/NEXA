name = "heating-cnc-mvp"
main = "src/workers/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "heating-cnc-db"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "TRI_LINK"
class_name = "TriLinkSession"

[[migrations]]
tag = "v1"
new_classes = ["TriLinkSession"]

[vars]
DEFAULT_DEVICE_ID = "turning-01"
