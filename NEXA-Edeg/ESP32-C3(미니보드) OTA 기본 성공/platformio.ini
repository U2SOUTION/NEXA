[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; 시리얼 모니터 설정
monitor_filters = default
monitor_rts = 0
monitor_dtr = 0

; 빌드 플래그
build_flags = 
    -DCORE_DEBUG_LEVEL=4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 라이브러리 의존성
lib_deps = 

; 업로드 설정 (기본)
upload_protocol = esptool

; OTA 업로드 환경
[env:esp32-c3-ota]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; OTA 전용 설정
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; OTA 업로드 설정
upload_protocol = espota
upload_port = ESP32-C3-OTA.local
upload_flags = 
    --auth=admin
    --port=3232

; 모니터 설정
monitor_speed = 115200
