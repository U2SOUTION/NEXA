; Heating CNC — ESP32-S3 (DLC32 MAX) scaffold
; Phase 2: FluidNC fork + Tri-Link WSS

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D HEATING_CNC_DEVICE_ID=\"turning-01\"
  -D HEATING_CNC_WS_PATH=\"/device/ws\"
lib_deps =
  ; bblanchon/ArduinoJson @ ^7
  ; links2004/WebSockets @ ^2.4
