; Smart water mat — ESP32 (boiler-side)
; Spec: NEXA V2.0/.../장비-스마트 온수 매트 해킹 제어.md
; Dual radio: ESP-NOW (rotor) + MQTT poll (portal). No mat branch in rotor FW.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D MAT_DEVICE_ID=\"water-mat-01\"
lib_deps =
  ; paulstoffregen/OneWire
  ; milesburton/DallasTemperature
  ; bblanchon/ArduinoJson @ ^7
